<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baund Pipeline</title>
  <meta name="theme-color" content="#0f2038">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand-mark"><img src="logo.png" alt="Baund Consulting"></div>
      <div>
        <h1>Kandidaten</h1>
        <div class="sub" id="countLabel">– Kandidaten</div>
      </div>
      <div class="spacer"></div>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Suchen …">
      </div>
      <button class="btn-primary" id="newCandidateBtn">+ Neuer Kandidat</button>
    </div>
    <div class="topbar-row">
      <div class="tabs" id="viewTabs">
        <button class="tab active" data-view="active">Aktiv</button>
        <button class="tab" data-view="archived">Archiviert</button>
      </div>
      <button class="alert-chip" id="alertChip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <span id="alertText">– brauchen Aufmerksamkeit</span>
      </button>
    </div>
    <div class="jump-row" id="jumpRow"></div>
  </div>

  <div class="new-candidate-form" id="newCandidateForm" hidden>
    <input type="text" id="newName" placeholder="Name des Kandidaten">
    <input type="text" id="newRole" placeholder="Rolle (optional)">
    <button class="btn-primary" id="saveCandidateBtn">Anlegen</button>
    <button class="btn-ghost" id="cancelCandidateBtn">Abbrechen</button>
  </div>

  <div class="wall-wrap">
    <div class="wall" id="wall"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
